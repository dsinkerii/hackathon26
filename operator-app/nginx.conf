server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Incident snapshots are sent as base64 JSON from the CV service.
    client_max_body_size 8m;

    # Resolve the backend through Docker's embedded DNS for every request-ish
    # interval, so recreating the backend container does not leave nginx
    # pointing at a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8086;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;

    # API and uploaded media are reverse-proxied, so the browser only ever
    # talks to this origin. No CORS, no hard-coded localhost in the build.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flutter is a single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
