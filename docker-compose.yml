name: safe-playground

# Everything here is for local development and demos. It binds to all
# interfaces so a phone on the same LAN can open the operator app; do not
# expose it to the internet without changing the passwords and secrets.

services:
  backend:
    build:
      context: ./backend
    image: safe-playground/backend:local
    ports:
      - "${BACKEND_PORT:-8086}:8086"
    environment:
      SERVER_PORT: "8086"
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:-local-ingest-token}
      # Must be at least 32 characters. Change it for anything shared.
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-me-32}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-playground}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-playground-demo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      # H2 database, uploaded snapshots and face images.
      - backend-data:/app/data
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp is enough for a TCP probe.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8086'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./operator-app
      args:
        # Same-origin: nginx proxies /api and /media to the backend.
        API_BASE_URL: /
    image: safe-playground/web:local
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # A synthetic camera, so the stack can be demonstrated on a machine with no
  # webcam at all:  docker compose --profile demo up --build
  camera:
    profiles: ["demo"]
    build:
      context: ./cv_branch
    image: safe-playground/camera-demo:local
    ports:
      - "${CAMERA_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Creates the camera catalog entry that points the operator app at the demo
  # stream. Runs once and exits; safe to re-run.
  seed-camera:
    profiles: ["demo"]
    build:
      context: ./scripts
    image: safe-playground/seed-camera:local
    depends_on:
      backend:
        condition: service_healthy
      camera:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8086
      ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-playground}
      ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-playground-demo}
      CAMERA_NAME: ${DEMO_CAMERA_NAME:-Demo camera}
      # The browser resolves this, not the container, so it must be a host URL.
      # If you change CAMERA_PORT, also set DEMO_CAMERA_URL in .env.
      CAMERA_URL: ${DEMO_CAMERA_URL:-http://localhost:8090/stream.mjpg}
      CAMERA_LOCATION: Docker demo stream
    restart: "no"

volumes:
  backend-data:
