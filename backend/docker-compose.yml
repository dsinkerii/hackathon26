services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: playground
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      INGEST_API_TOKEN: playground
      JWT_SECRET: playgroundplaygroundplaygroundplayground
      INITIAL_ADMIN_USERNAME: playground
      INITIAL_ADMIN_PASSWORD: playground
    ports:
      - "5432:5432"
    volumes:
      - playground-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground -d playground"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  playground-postgres:
