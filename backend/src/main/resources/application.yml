spring:
  application:
    name: playground-backend
  profiles:
    default: h2          # разработка на H2; для демо: --spring.profiles.active=postgres
  jackson:
    serialization:
      write-dates-as-timestamps: false   # даты как ISO-8601 строки
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                 # схему управляет только Flyway
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080

---
spring:
  config.activate.on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/playground;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration/{vendor}
  h2.console:
    enabled: true
    path: /h2-console

---
spring:
  config.activate.on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/playground
    username: playground
    password: playground
  flyway:
    locations: classpath:db/migration/{vendor}