spring:
  application:
    name: playground-backend
  profiles:
    default: h2          # разработка на H2; для демо: --spring.profiles.active=postgres
  jackson:
    serialization:
      write-dates-as-timestamps: false   # даты как ISO-8601 строки
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                 # схему управляет только Flyway
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080

app:
  ingest:
    token: ${INGEST_API_TOKEN:}
    deduplication-window: ${INGEST_DEDUPLICATION_WINDOW:30s}
  media:
    directory: ${MEDIA_DIRECTORY:./data/media}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    enabled: ${DEMO_MODE:false}

---
spring:
  config.activate.on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/playground;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration/{vendor},classpath:db/migration/legacy
  h2.console:
    enabled: true
    path: /h2-console

---
spring:
  config.activate.on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/playground}
    username: ${DATABASE_USERNAME:playground}
    password: ${DATABASE_PASSWORD:playground}
  flyway:
    locations: classpath:db/migration/{vendor},classpath:db/migration/legacy
